<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABR et ordre d'insertion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="commun/atelier.css">
<script src="commun/atelier.js"></script>
<script src="commun/arbres.js"></script>
</head>
<body>
<script>
(() => {
const { S, plural } = Atelier;
const T = Arbres;

/* ---------- Scène : les deux arbres côte à côte, avec leur ordre d'insertion et leur hauteur ---------- */
const trees = { a: null, b: null }, orders = { a: [], b: [] };
function scene(st = {}) {
  const items = [], arrows = [];
  let x = 0;
  for (const k of ['a', 'b']) {
    const r = trees[k];
    const D = T.draw(r, { prefix: k, x, y: 0, hl: (st.hl || {})[k], sx: 50, sy: 74 });
    const left = r ? D.box.x0 : x;
    const title = `${k.toUpperCase()} : ${orders[k].join(' ') || '(vide)'}`;
    items.push(S.text(k + 'T', left, -52, title.length > 46 ? title.slice(0, 45) + '…' : title, { align: 'start', cls: 'mono' }));
    items.push(S.text(k + 'H', left, -30, r ? `hauteur ${T.height(r)} · ${plural(T.count(r), 'nœud')}` : 'arbre vide', { align: 'start', cls: 'muted' }));
    items.push(...D.items); arrows.push(...D.arrows);
    if (st.probe && st.probe[k]) {
      const p = D.L.get(st.probe[k].id);
      if (p) items.push(S.box(k + 'probe', x + p.x - 62, p.y - 38, 40, 22, st.probe[k].v, { cls: 'strong', rx: 11, fs: 12 }));
    }
    x = (r ? D.box.x1 : x) + 150;
  }
  return { items, arrows };
}

/* ---------- Modèle ---------- */
function build(A, k, vals) {
  trees[k] = null; orders[k] = [];
  const dups = [];
  for (const v of vals) {
    if (!trees[k]) { trees[k] = T.node(v); orders[k].push(v); A.emit(scene({ hl: { [k]: { [trees[k].id]: 'new' } } }), `${k.toUpperCase()} : ${v} devient la racine.`, { kind: 'ins' }); continue; }
    let n = trees[k]; const path = [], hl = {};
    let dup = false;
    for (;;) {
      if (v === n.v) { dup = true; break; }
      path.push(`${v} ${v < n.v ? '<' : '>'} ${n.v}`); hl[n.id] = 'cmp';
      const s = v < n.v ? 'left' : 'right';
      if (!n[s]) { n[s] = T.node(v); hl[n[s].id] = 'new'; break; }
      n = n[s];
    }
    if (dup) { dups.push(v); continue; }
    orders[k].push(v);
    A.emit(scene({ hl: { [k]: hl } }), `${k.toUpperCase()} : insertion de ${v} comme feuille (${path.join(', ')}).`, { kind: 'ins' });
  }
  A.emit(scene(), `Arbre ${k.toUpperCase()} construit : hauteur ${T.height(trees[k])}.${dups.length ? ` Doublons ignorés : ${dups.join(', ')}.` : ''}`, { kind: 'done' });
  return `hauteur ${T.height(trees[k])}`;
}

function search(A, v) {
  const walk = r => { const out = []; let n = r; while (n) { out.push(n); if (n.v === v) break; n = v < n.v ? n.left : n.right; } return out; };
  const pa = walk(trees.a), pb = walk(trees.b), found = p => p.length && p[p.length - 1].v === v;
  const steps = Math.max(pa.length, pb.length);
  if (!steps) { A.emit(scene(), 'Les deux arbres sont vides.', { kind: 'absent' }); return 'arbres vides'; }
  for (let i = 0; i < steps; i++) {
    const hl = { a: {}, b: {} }, probe = {}, parts = [];
    for (const [k, p] of [['a', pa], ['b', pb]]) {
      p.slice(0, Math.min(i, p.length)).forEach(n => hl[k][n.id] = 'acc');
      if (i < p.length) {
        const n = p[i]; hl[k][n.id] = n.v === v ? 'new' : 'cmp'; probe[k] = { id: n.id, v };
        parts.push(`${k.toUpperCase()} compare ${v} à ${n.v}${n.v === v ? ' : trouvé !' : v < n.v ? ' : à gauche' : ' : à droite'}`);
      } else parts.push(`${k.toUpperCase()} a déjà fini (${p.length} comparaison${p.length > 1 ? 's' : ''})`);
    }
    A.emit(scene({ hl, probe }), `Comparaison n° ${i + 1}. ${parts.join(' · ')}.`, { kind: 'cmp',
      readout: ['Comparaisons : A = ', String(Math.min(i + 1, pa.length)), '   ·   B = ', String(Math.min(i + 1, pb.length))] });
  }
  const res = (p, k) => `${k} : ${found(p) ? 'trouvé' : 'absent'} en ${plural(p.length, 'comparaison')}`;
  A.emit(scene({ hl: { a: Object.fromEntries(pa.map(n => [n.id, n.v === v ? 'new' : 'acc'])), b: Object.fromEntries(pb.map(n => [n.id, n.v === v ? 'new' : 'acc'])) } }),
    `${res(pa, 'A')} ; ${res(pb, 'B')}. Les mêmes valeurs, mais pas la même forme : le nombre de comparaisons dépend de la hauteur, donc de l'ordre d'insertion.`,
    { kind: 'done', readout: ['Comparaisons : A = ', String(pa.length), '   ·   B = ', String(pb.length)] });
  return `A ${pa.length} · B ${pb.length}`;
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let lastA = [8, 3, 10, 1, 6, 14, 4, 7, 13];

Atelier.init({
  id: 'atelier-ordre-insertion-abr',
  title: 'ABR et ordre d\'insertion',
  subtitle: 'CM4 · les mêmes valeurs insérées dans deux ordres différents : équilibré ou dégénéré ?',
  conv: 'gauche < nœud < droite',
  commands: {
    a: { args: 'nums', aliases: ['ordreA', 'arbreA'], check: v => v.length > 31 ? '31 valeurs au plus.' : '' },
    b: { args: 'nums', aliases: ['ordreB', 'arbreB'], check: v => v.length > 31 ? '31 valeurs au plus.' : '' },
    search: { args: 'num', aliases: ['s', 'chercher', 'rechercher'] },
  },
  help: `a 8 3 10 1 6 14   construit l'arbre A dans cet ordre
b 1 3 6 8 10 14   construit l'arbre B dans cet ordre
search 13         recherche dans les deux arbres
# commentaire`,
  quick: { input: 'num', buttons: [
    { label: 'Rechercher', cmd: 'search', arg: true, primary: true },
    { label: 'B = A trié', line: () => 'b ' + lastA.slice().sort((x, y) => x - y).join(' ') + '   # ordre croissant' },
    { label: 'B = A mélangé', line: () => 'b ' + shuffle(lastA).join(' ') + '   # mélange' },
  ] },
  kinds: { start: { label: 'Départ', tone: 'acc' }, ins: { label: 'Insertion', tone: 'acc' }, done: { label: 'Bilan', tone: 'new' },
    cmp: { label: 'Comparaison', tone: 'cmp' }, absent: { label: 'Vide', tone: 'bad' } },
  hold: { ins: 0.7, done: 2.4, cmp: 1.6 },
  legend: [['cmp', 'nœud comparé / chemin d\'insertion'], ['acc', 'déjà parcouru'], ['new', 'nouveau nœud / trouvé']],
  example: `a 8 3 10 1 6 14 4 7 13     # l'ABR du cours
b 1 3 4 6 7 8 10 13 14     # les mêmes valeurs, triées
search 13
search 5
`,
  build(list, A) {
    T.reset(); trees.a = trees.b = null; orders.a = []; orders.b = [];
    A.op('début', null, () => { A.emit(scene(), 'Deux arbres vides : construisez A et B avec les mêmes valeurs dans deux ordres différents.', { kind: 'start' }); return ''; });
    for (const o of list) {
      if (o.cmd === 'a' || o.cmd === 'b') { if (o.cmd === 'a') lastA = o.vals.slice(); A.op(`${o.cmd} ${o.vals.join(' ')}`, o.line, () => build(A, o.cmd, o.vals)); }
      else A.op(`search ${o.vals[0]}`, o.line, () => search(A, o.vals[0]));
    }
  },
});
})();
</script>
</body>
</html>
