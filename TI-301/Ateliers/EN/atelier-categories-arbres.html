<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories of binary trees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../commun/atelier.css">
<script src="../commun/atelier.js"></script>
<script src="../commun/arbres.js"></script>
</head>
<body>
<script>
(() => {
const { S, plural } = Atelier;
const T = Arbres;

/* ---------- Scene: the tree, with the filling of each level on the left ---------- */
let root;
function levels(r) {
  const out = []; let cur = r ? [r] : [];
  while (cur.length) { out.push(cur); cur = cur.flatMap(n => [n.left, n.right].filter(Boolean)); }
  return out;
}
function scene(st = {}) {
  const D = T.draw(root, { hl: st.hl, sub: st.sub, subCls: st.subCls, nulls: st.nulls, nullSub: st.nullSub });
  const items = D.items, arrows = D.arrows;
  if (root) levels(root).forEach((lv, d) => {
    const full = lv.length === 2 ** d;
    items.push(S.text('lv' + d, D.box.x0 - 30, d * 80, `level ${d}: ${lv.length} / ${2 ** d}`, { align: 'end', cls: (st.lvl && st.lvl[d]) || (full ? 'muted' : 'muted') }));
  });
  return { items, arrows };
}

/* ---------- Analysis ---------- */
function analyse(A) {
  const all = T.nodes(root), lv = levels(root), h = lv.length - 1, res = {};
  const kids = n => (n.left ? 1 : 0) + (n.right ? 1 : 0);
  const child = k => k === 1 ? '1 child' : k + ' children';
  const RD = () => ['Summary: ', ['strict', 'complete', 'perfect', 'degenerate'].map(k => res[k] == null ? `${k} ?` : `${k}: ${res[k] ? 'yes' : 'no'}`).join(' · ')];
  A.emit(scene(), `Tree with ${plural(all.length, 'node')} and height ${h}. Let us check the four definitions of the lecture.`, { kind: 'tree', readout: RD() });

  /* strict (locally complete): every node has 0 or 2 children */
  const one = all.filter(n => kids(n) === 1);
  res.strict = !one.length;
  A.emit(scene({ hl: Object.fromEntries(all.map(n => [n.id, kids(n) === 1 ? 'bad' : 'new'])), sub: Object.fromEntries(all.map(n => [n.id, child(kids(n))])) }),
    res.strict ? 'Strict: every node has 0 or 2 children. YES.'
               : `Strict: every node must have 0 or 2 children, but ${one.map(n => n.v).join(', ')} ${one.length > 1 ? 'have' : 'has'} only one. NO.`,
    { kind: res.strict ? 'yes' : 'no', readout: RD() });

  /* complete: all levels are full except perhaps the last one, whose nodes are packed to the left */
  const slots = []; let q = [root];
  for (let d = 0; d <= h; d++) { const nx = []; for (const n of q) { slots.push({ n, d }); nx.push(n ? n.left : null, n ? n.right : null); } q = nx; }
  const firstHole = slots.findIndex(s => !s.n);
  const after = firstHole < 0 ? [] : slots.slice(firstHole).filter(s => s.n).map(s => s.n);
  res.complete = !after.length;
  const nullHl = {};
  const hl2 = Object.fromEntries(all.map(n => [n.id, after.includes(n) ? 'bad' : 'new']));
  let holeTxt = '';
  if (firstHole >= 0) {
    const hole = slots[firstHole], k = firstHole - (2 ** hole.d - 1);
    holeTxt = `the first empty place is on level ${hole.d} (position ${k + 1} from the left)`;
    const parentSlot = slots[Math.floor((firstHole - 1) / 2)];
    if (parentSlot && parentSlot.n) nullHl[`${parentSlot.n.id}${firstHole % 2 ? 'L' : 'R'}`] = 'bad';
  }
  A.emit(scene({ hl: { ...hl2, ...nullHl }, nulls: !res.complete, nullSub: Object.fromEntries(Object.keys(nullHl).map(k => [k, 'hole'])) }),
    res.complete ? `Complete: reading level by level, from left to right, there is no hole before the last node${firstHole >= 0 ? ' (the empty places are all at the end of the last level)' : ''}. YES.`
                 : `Complete: ${holeTxt}, but some nodes come after it (${after.map(n => n.v).join(', ')}). The levels are not filled from left to right. NO.`,
    { kind: res.complete ? 'yes' : 'no', readout: RD() });

  /* perfect: all levels are full */
  const notFull = lv.map((l, d) => l.length === 2 ** d ? null : d).filter(d => d != null);
  res.perfect = !notFull.length;
  A.emit(scene({ hl: Object.fromEntries(all.map(n => [n.id, res.perfect ? 'new' : ''])), lvl: Object.fromEntries(notFull.map(d => [d, 'big'])) }),
    res.perfect ? `Perfect: each level d holds exactly 2^d nodes, that is 2^${h + 1} − 1 = ${all.length} nodes in total. YES.`
                : `Perfect: level d should hold 2^d nodes, but ${notFull.map(d => `level ${d} has only ${lv[d].length} out of ${2 ** d}`).join(', ')}. NO.`,
    { kind: res.perfect ? 'yes' : 'no', readout: RD() });

  /* degenerate: every node has at most one child (it is a list) */
  const two = all.filter(n => kids(n) === 2);
  res.degenerate = !two.length;
  A.emit(scene({ hl: Object.fromEntries(all.map(n => [n.id, kids(n) === 2 ? 'bad' : 'new'])), sub: Object.fromEntries(all.map(n => [n.id, child(kids(n))])) }),
    res.degenerate ? `Degenerate: every node has at most one child: it is in fact a list (height ${h} for ${all.length} nodes). YES.`
                   : `Degenerate: every node must have at most one child, but ${two.map(n => n.v).join(', ')} ${two.length > 1 ? 'have' : 'has'} two. NO.`,
    { kind: res.degenerate ? 'yes' : 'no', readout: RD() });

  A.emit(scene(), `Summary: strict ${res.strict ? 'yes' : 'no'}, complete ${res.complete ? 'yes' : 'no'}, perfect ${res.perfect ? 'yes' : 'no'}, degenerate ${res.degenerate ? 'yes' : 'no'}.${res.perfect ? ' A perfect tree is necessarily strict and complete.' : ''}`,
    { kind: 'end', readout: RD() });
  return ['strict', 'complete', 'perfect', 'degenerate'].filter(k => res[k]).join(', ') || 'no category';
}

const EX = {
  strict: '(A (B (D) (E (H) (I))) (C))',
  complete: '(A (B (D) (E)) (C (F) .))',
  perfect: '(A (B (D) (E)) (C (F) (G)))',
  degenerate: '(A . (B (C . (D)) .))',
  none: '(A (B (D) .) (C (E) (F)))',
};

Atelier.init({
  id: 'atelier-categories-arbres-en',
  lang: 'en',
  title: 'Categories of binary trees',
  subtitle: 'Lecture #4 · strict, complete, perfect, degenerate: checking the definitions on the tree of your choice.',
  conv: 'level d: at most 2^d nodes',
  commands: { ...T.commands },
  help: T.help + `
each tree created is analysed
# comment`,
  quick: { input: 'text', placeholder: '(A (B (D) (E)) (C))', check: T.check, buttons: [
    { label: 'Analyse this tree', cmd: 'tree', arg: true, primary: true },
    { label: 'Strict', line: () => 'tree ' + EX.strict }, { label: 'Complete', line: () => 'tree ' + EX.complete },
    { label: 'Perfect', line: () => 'tree ' + EX.perfect }, { label: 'Degenerate', line: () => 'tree ' + EX.degenerate },
  ] },
  note: '<b>Strict</b>: every node has 0 or 2 children.<br><b>Complete</b>: all levels are full, except perhaps the last one, where the leaves are packed to the left.<br><b>Perfect</b>: all levels are full.<br><b>Degenerate</b>: every node has at most one child (it is a list).',
  noteTitle: 'Definitions from the lecture',
  kinds: { start: { label: 'Start', tone: 'acc' }, tree: { label: 'Tree', tone: 'acc' }, yes: { label: 'Yes', tone: 'new' }, no: { label: 'No', tone: 'bad' }, end: { label: 'Summary', tone: 'vio' } },
  hold: { tree: 1.6, yes: 2.4, no: 2.8, end: 2.6 },
  legend: [['new', 'node that follows the rule'], ['bad', 'node that breaks it'], ['ghost', 'empty place (hole)']],
  example: `tree ${EX.strict}
tree ${EX.complete}
tree ${EX.perfect}
tree ${EX.degenerate}
tree ${EX.none}
`,
  emptyMsg: 'Create a tree with "tree" or "bst".',
  build(list, A) {
    T.reset(); root = null;
    A.op('start', null, () => { A.emit(scene(), 'Create a tree: it will be analysed according to the four categories of the lecture.', { kind: 'start' }); return ''; });
    for (const o of list) {
      const r = T.fromCommand(o);
      A.op(r.label, o.line, () => { root = r.root; return analyse(A); });
    }
  },
});
})();
</script>
</body>
</html>
